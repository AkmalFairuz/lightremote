version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the native Windows desktop app
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:build:frontend
    cmds:
      - task: generate:syso
      - 'go build {{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}} -o "bin/{{.APP_NAME}}.exe"'
      - powershell Remove-Item *.syso
    env:
      GOOS: windows
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 0

  generate:syso:
    internal: true
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH | default ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH | default ARCH}}.syso

  run:
    summary: Runs the native Windows development app
    cmds:
      - 'bin/{{.APP_NAME}}.exe'
