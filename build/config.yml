version: '3'

info:
  companyName: AkmalFairuz
  productName: LightRemote
  productIdentifier: com.akmalfairuz.lightremote
  description: Remote desktop and file workspace
  copyright: (c) 2026, AkmalFairuz
  version: 0.0.1

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - frontend
      - bin
    file:
      - .DS_Store
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
