version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the native Linux desktop app
    deps:
      - task: common:generate:icons
      - task: common:build:frontend
    cmds:
      - 'go build {{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{end}} -o "bin/{{.APP_NAME}}"'
    env:
      GOOS: linux
      GOARCH: '{{.TARGET_ARCH | default ARCH}}'
      CGO_ENABLED: 1

  run:
    summary: Runs the native Linux development app
    cmds:
      - 'bin/{{.APP_NAME}}'
