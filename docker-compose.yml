services:
  lightremote:
    image: ${LIGHTREMOTE_IMAGE:-ghcr.io/akmalfairuz/lightremote:latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      LOCAL_MODE: "false"
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /data/lightremote.db
      FRONTEND_DIR: /app/frontend
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a base64-encoded 32-byte key}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for the initial administrator}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_TTL: "${SESSION_TTL:-24h}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-1073741824}"
      DIAL_TIMEOUT: "${DIAL_TIMEOUT:-10s}"
    volumes:
      - lightremote-data:/data

volumes:
  lightremote-data:
