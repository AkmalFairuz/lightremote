name: Docker image

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      release_sha:
        type: string
        required: true
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build image
    if: github.event_name != 'release' && inputs.release_tag == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=lightremote
          cache-to: type=gha,scope=lightremote,mode=max

  publish:
    name: Publish release image
    concurrency:
      group: lightremote-docker-release-${{ inputs.release_tag || github.event.release.tag_name }}
      cancel-in-progress: false
    if: (github.event_name == 'release' && github.event.action == 'published') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Set image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.release_tag || github.event.release.tag_name }},priority=900
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lightremote
          cache-to: type=gha,scope=lightremote,mode=max
