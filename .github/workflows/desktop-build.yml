name: Desktop build

on:
  push:
    branches: [feature/wails]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
          - os: macos-15
            arch: arm64
          - os: windows-2025
            arch: amd64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up macOS packaging Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux WebView libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - name: Build desktop app
        if: runner.os != 'macOS'
        run: wails3 build GOARCH=${{ matrix.arch }}
      - name: Build and package macOS app
        if: runner.os == 'macOS'
        run: wails3 task darwin:package TARGET_ARCH=${{ matrix.arch }}
      - name: Archive compiled app
        if: runner.os != 'macOS'
        shell: bash
        run: |
          binary=lightremote-desktop
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary=lightremote-desktop.exe
          fi
          tar -czf "lightremote-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C bin "$binary"
      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lightremote-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/lightremote-darwin-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload compiled app
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lightremote-${{ matrix.os }}-${{ matrix.arch }}
          path: lightremote-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish desktop release assets
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lightremote-*
          path: release-artifacts
      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          for artifact_dir in release-artifacts/lightremote-*; do
            artifact_name="${artifact_dir##*/}"
            arch="${artifact_name##*-}"
            case "$artifact_name" in
              lightremote-macos-*)
                platform=macos
                extension=dmg
                ;;
              lightremote-windows-*)
                platform=windows
                extension=tar.gz
                ;;
              lightremote-ubuntu-*)
                platform=linux
                extension=tar.gz
                ;;
              *)
                echo "Unexpected build artifact: $artifact_name" >&2
                exit 1
                ;;
            esac
            files=("$artifact_dir"/*)
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Expected one file in $artifact_dir" >&2
              exit 1
            fi
            asset="lightremote-$platform-$arch.$extension"
            cp "${files[0]}" "$asset"
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          done
