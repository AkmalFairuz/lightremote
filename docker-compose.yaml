services:
  lightremote:
    image: ghcr.io/akmalfairuz/lightremote:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "8080:8080"
    # environment:
      # These values are already supplied by the image or server defaults.
      # Uncomment environment and a setting to override its value here.
      # LISTEN_ADDR: ":8080"
      # LOCAL_MODE: "false"
      # DATABASE_DRIVER: sqlite
      # SQLITE_PATH: /data/lightremote.db
      # FRONTEND_DIR: /app/frontend
      # ENCRYPTION_KEY: ""
      # ENCRYPTION_KEY_FILE: "/data/vault.key"
      # ADMIN_EMAIL: "admin@localhost"
      # ADMIN_PASSWORD: ""
      # PUBLIC_ORIGIN: ""
      # SESSION_TTL: "24h"
      # MAX_UPLOAD_BYTES: "1073741824"
      # DIAL_TIMEOUT: "10s"
    volumes:
      - ./data:/data
